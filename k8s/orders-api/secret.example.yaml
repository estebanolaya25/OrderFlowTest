# PLANTILLA: muestra qué secretos necesita Orders API, sin valores reales. No se versiona el secreto de verdad.
# En el clúster se crearía a partir de esta plantilla, o mejor, desde Azure Key Vault
# (Secrets Store CSI Driver) para no tener contraseñas en archivos.
#
#   kubectl create secret generic orders-api-secrets -n orderflow \
#     --from-literal=ConnectionStrings__SQLConnectionString="Server=...;Database=OrderFlowOrdersDB;User Id=orderflow-orders;Password=...;Encrypt=True;" \
#     --from-literal=RabbitMQ__Usuario="orderflow" \
#     --from-literal=RabbitMQ__Password="..."
apiVersion: v1
kind: Secret
metadata:
  name: orders-api-secrets
  namespace: orderflow
  labels:
    app: orders-api
type: Opaque
stringData:
  ConnectionStrings__SQLConnectionString: "<cadena de conexión a OrderFlowOrdersDB>"
  RabbitMQ__Usuario: "<usuario de RabbitMQ>"
  RabbitMQ__Password: "<contraseña de RabbitMQ>"
