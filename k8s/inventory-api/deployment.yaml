# Inventory: 2 réplicas que compiten por la misma cola "inventory-pedido-creado" (competing consumers).
# RabbitMQ entrega cada mensaje a una sola réplica; si una muere a mitad de proceso, el mensaje se reentrega a otra.
# Eso es seguro porque el consumidor es idempotente: MensajesProcesados + Reservas + UPDATE condicional del stock,
# todo en una transacción (ver IdempotenciaReservaTests).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: orderflow
  labels:
    app: inventory-api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: inventory-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: inventory-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
      containers:
        - name: inventory-api
          image: orderflowacr.azurecr.io/orderflow/inventory-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: inventory-api-config
            - secretRef:
                name: inventory-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Si SQL Server no responde, la réplica deja de recibir tráfico HTTP. Con RabbitMQ caído el check
          # queda "Degraded" (sigue lista) y MassTransit reintenta la conexión por su cuenta.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
