# PLANTILLA: muestra qué secretos necesita Inventory, sin valores reales (ver k8s/orders-api/secret.example.yaml).
#
#   kubectl create secret generic inventory-api-secrets -n orderflow \
#     --from-literal=ConnectionStrings__SQLConnectionString="Server=...;Database=OrderFlowInventoryDB;User Id=orderflow-inventory;Password=...;Encrypt=True;" \
#     --from-literal=RabbitMQ__Usuario="orderflow" \
#     --from-literal=RabbitMQ__Password="..."
apiVersion: v1
kind: Secret
metadata:
  name: inventory-api-secrets
  namespace: orderflow
  labels:
    app: inventory-api
type: Opaque
stringData:
  ConnectionStrings__SQLConnectionString: "<cadena de conexión a OrderFlowInventoryDB>"
  RabbitMQ__Usuario: "<usuario de RabbitMQ>"
  RabbitMQ__Password: "<contraseña de RabbitMQ>"
