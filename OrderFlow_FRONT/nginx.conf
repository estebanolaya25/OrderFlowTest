server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /api/orders -> http://orders-api:8080/orders (la barra final de proxy_pass quita el prefijo /api).
    # El navegador solo habla con este servidor: sin CORS y sin URLs del backend en el bundle.
    location /api/ {
        proxy_pass http://orders-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos con hash en el nombre: se pueden cachear sin límite.
    location ~* \.(?:js|css|woff2?|ttf|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta del router de Angular (/pedidos/nuevo) devuelve index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
